name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (fmt, clippy, test, build)
    runs-on: ubuntu-latest
    # The Debian release of the image's builder and runtime stages
    container: rust:1-trixie
    steps:
      - uses: actions/checkout@v4
      # ffmpeg as the image installs it, zstd so the Rust cache isn't gzipped, and rustfmt
      # and clippy, which the image's minimal rustup profile leaves out
      - name: Install ffmpeg, zstd, rustfmt and clippy
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg zstd
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # $CARGO_HOME/bin holds the image's toolchain; nothing is cargo-installed
          cache-bin: "false"
      # Tests that lock a folder skip themselves when they can still read it, as root can,
      # and BrowseDirectories lists only roots such as /home. So cargo runs as ci, with its
      # home in /home/ci, and this step fails if ci can list a folder with mode 000.
      - name: Add a user that isn't root
        run: |
          useradd --create-home ci
          chown -R ci: . /usr/local/cargo
          mkdir -m 000 /tmp/locked
          if runuser -u ci -- ls /tmp/locked; then
            echo "::error::ci can list a folder with mode 000, so tests would skip"
            exit 1
          fi
          rmdir /tmp/locked
      - name: Format check
        run: runuser -u ci -- cargo fmt --all -- --check
      - name: Clippy
        run: runuser -u ci -- cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: runuser -u ci -- cargo test --workspace
      - name: Build release
        run: runuser -u ci -- cargo build --release --locked --bin rustyfin
      - uses: actions/upload-artifact@v4
        with:
          name: rustyfin
          path: target/release/rustyfin
          if-no-files-found: error
          retention-days: 1

  web:
    name: Web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Corepack provides the pnpm version pinned in package.json (packageManager), as in the Dockerfile
      - name: Build
        working-directory: crates/rustyfin-web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: crates/rustyfin-web/dist
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [check, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The Dockerfile's prebuilt target copies these instead of building from source
      - uses: actions/download-artifact@v4
        with:
          name: rustyfin
          path: prebuilt
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: prebuilt/web
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      # Pull requests only check that the image builds
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: prebuilt
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max